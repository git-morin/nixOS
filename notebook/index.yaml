page:
  siteTitle: Gab's Notebook
  headHtml: |
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.11.1/styles/base16/solarized-light.min.css" media="(prefers-color-scheme: light)">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.11.1/styles/base16/solarized-dark.min.css" media="(prefers-color-scheme: dark)">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.11.1/highlight.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.11.1/languages/nix.min.js"></script>
    <script>
      function highlightCode() {
        document.querySelectorAll('pre code:not(.hljs)').forEach(el => {
          if (!el.className.includes('mermaid')) {
            hljs.highlightElement(el);
          }
        });
      }
      setTimeout(highlightCode, 200);
      document.addEventListener('ema:route-changed', () => setTimeout(highlightCode, 200));
    </script>
    <style>
      body {
        font-size: 17px;
        line-height: 1.75;
        -webkit-font-smoothing: antialiased;
      }

      body {
        background-color: #fffcf9;
        color: #1f2937;
      }

      h1, h2, h3, h4, h5, h6 {
        color: #111827;
        font-weight: 600;
        margin-top: 1.5em;
      }

      h2 { border-bottom: 2px solid #fed7aa; padding-bottom: 0.3em; }

      a {
        color: #ea580c;
        text-decoration: none;
        transition: color 0.2s ease;
      }

      a:hover {
        color: #c2410c;
        text-decoration: underline;
      }

      blockquote {
        color: #57534e;
        border-left: 4px solid #fb923c;
        background-color: #fff7ed;
        padding: 0.75em 1em;
        margin: 1.5em 0;
        border-radius: 0 6px 6px 0;
      }

      :not(pre) > code {
        background-color: #fff7ed;
        color: #9a3412;
        padding: 0.2em 0.4em;
        border-radius: 4px;
        font-size: 0.9em;
      }

      pre {
        background-color: #fffbf5 !important;
        border: 1px solid #fed7aa;
        border-radius: 8px;
        padding: 1em !important;
      }

      pre code {
        background-color: transparent;
        padding: 0;
      }

      pre code.hljs {
        background: transparent !important;
      }

      hr {
        border: none;
        border-top: 1px solid #fed7aa;
        margin: 2em 0;
      }

      @media (prefers-color-scheme: dark) {
        html, body, .bg-gray-900, .dark\:bg-gray-900 {
          background-color: #2d3748 !important;
          color: #e7e5e4;
        }

        h1, h2, h3, h4, h5, h6 {
          color: #fafaf9;
        }

        h2 {
          border-bottom-color: #9a3412;
        }

        a {
          color: #fb923c;
        }

        a:hover {
          color: #fdba74;
        }

        blockquote {
          color: #a8a29e;
          border-left-color: #ea580c;
          background-color: #292524;
        }

        :not(pre) > code {
          background-color: #292524;
          color: #fdba74;
        }

        pre {
          background-color: #1c1917 !important;
          border-color: #44403c;
        }

        hr {
          border-top-color: #44403c;
        }
      }

      main.max-w-7xl {
        border-radius: 24px;
        background-color: #ffffff;
        padding: 1.5rem;
      }

      @media (prefers-color-scheme: dark) {
        main.max-w-7xl {
          background-color: #1e2533;
        }
      }

      ul, ol {
        padding-left: 1.5em;
      }

      li {
        margin-bottom: 0.5em;
      }

      table {
        border-collapse: collapse;
        width: 100%;
        margin: 1.5em 0;
      }

      th, td {
        border: 1px solid #fed7aa;
        padding: 0.75em;
        text-align: left;
      }

      th {
        background-color: #fff7ed;
        font-weight: 600;
      }

      @media (prefers-color-scheme: dark) {
        th, td {
          border-color: #44403c;
        }
        th {
          background-color: #292524;
        }
      }

      /* Inline badges (e.g. year tags in the brag sheet) */
      .badge {
        display: inline-block;
        background-color: #fed7aa;
        color: #9a3412;
        font-size: 0.78em;
        font-weight: 600;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        padding: 0.1em 0.55em;
        margin: 0 0.25em;
        border-radius: 999px;
        border: 1px solid #fdba74;
        line-height: 1.4;
        vertical-align: middle;
        letter-spacing: 0.02em;
      }

      .badge-ongoing {
        background-color: #dcfce7;
        color: #166534;
        border-color: #86efac;
      }

      .badge-team {
        background-color: #dbeafe;
        color: #1e40af;
        border-color: #93c5fd;
      }

      @media (prefers-color-scheme: dark) {
        .badge {
          background-color: #44261a;
          color: #fdba74;
          border-color: #9a3412;
        }
        .badge-ongoing {
          background-color: #14361f;
          color: #86efac;
          border-color: #166534;
        }
        .badge-team {
          background-color: #1e293b;
          color: #93c5fd;
          border-color: #1e40af;
        }
      }

      /* Year timeline (brag sheet) */
      .timeline {
        position: relative;
        padding: 1.25rem 0;
        margin: 1.5rem 0 2rem;
      }

      .timeline > p {
        display: flex !important;
        align-items: center;
        justify-content: space-between;
        gap: 0.5rem;
        margin: 0;
        position: relative;
      }

      .timeline > p::before {
        content: "";
        position: absolute;
        left: 1rem;
        right: 1rem;
        top: 50%;
        height: 2px;
        background: linear-gradient(to right, #fdba74, #fb923c);
        z-index: 0;
      }

      .timeline a {
        position: relative;
        z-index: 1;
        flex: 1 1 0;
        text-align: center;
        background-color: #ffffff;
        border: 2px solid #fb923c;
        color: #9a3412 !important;
        font-weight: 600;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        padding: 0.4rem 0.6rem;
        border-radius: 999px;
        text-decoration: none;
        transition: transform 0.15s ease, background-color 0.15s ease, color 0.15s ease;
      }

      .timeline a:hover {
        background-color: #fb923c;
        color: #ffffff !important;
        transform: translateY(-2px);
        text-decoration: none;
      }

      @media (prefers-color-scheme: dark) {
        .timeline > p::before {
          background: linear-gradient(to right, #9a3412, #ea580c);
        }
        .timeline a {
          background-color: #1e2533;
          border-color: #ea580c;
          color: #fdba74 !important;
        }
        .timeline a:hover {
          background-color: #ea580c;
          color: #ffffff !important;
        }
      }

      /* Brand logos in tables */
      td img, th img { max-width: 15%; height: auto; display: inline-block; vertical-align: middle; }
      td:first-child img { max-width: 30%; }
      li img { height: 32px; width: auto; display: inline-block; vertical-align: middle; margin-right: 4px; }
      td:first-child img { max-width: 30%; }

      /* Heat scale badges */
      .heat {
        display: inline-block;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 0.85em;
        padding: 0.1em 0.45em;
        border-radius: 4px;
        border: 1px solid;
        vertical-align: middle;
      }
      .heat-mild     { color: #4ade80; border-color: #4ade80; background: rgba(74,222,128,0.1); }
      .heat-medium   { color: #facc15; border-color: #facc15; background: rgba(250,204,21,0.1); }
      .heat-hot      { color: #fb923c; border-color: #fb923c; background: rgba(251,146,60,0.1); }
      .heat-very-hot { color: #f87171; border-color: #f87171; background: rgba(248,113,113,0.1); }
      .heat-extreme  { color: #dc2626; border-color: #dc2626; background: rgba(220,38,38,0.1); }

      /* Section intro blockquotes */
      .section-intro {
        font-style: italic;
        color: #57534e;
      }

      @media (prefers-color-scheme: dark) {
        .section-intro {
          color: #a8a29e;
        }
      }
    </style>

template:
  iconUrl: favicon.ico
  urlStrategy: pretty
  uptree:
    enable: true
  sidebar:
    enable: false
  toc:
    enable: false
  breadcrumbs:
    enable: true
  theme: orange
  base:
    containerClass: container mx-auto max-w-screen-lg
